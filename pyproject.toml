[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maskline"
version = "0.1.0"
description = "Offline sensitive-field discovery and declarative masking pipeline for local datasets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "maskline contributors" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
maskline = "maskline.__main__:main"

[tool.setuptools.packages.find]
include = ["maskline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
